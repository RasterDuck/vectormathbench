name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vectormathbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        shell: pwsh
        run: cmake "--preset=ci-$("${{ matrix.os }}".split("-")[0])"

      - name: Build all ISA variants
        run: cmake --build build --config Release --parallel 2

      - name: Verify semantic parity
        run: ctest --test-dir build --output-on-failure -C Release

  performance:
    name: Performance report
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset=ci-ubuntu

      - name: Build all ISA variants
        run: cmake --build build --config Release --parallel 2

      - name: Run benchmarks
        run: |
          mkdir -p benchmark-results
          for isa in sse42 avx avx2; do
            "./build/vectormathbench_${isa}" \
              --json "benchmark-results/${isa}.json" \
              --csv "benchmark-results/${isa}.csv" \
              > "benchmark-results/${isa}.md"
            {
              echo "## ${isa}"
              cat "benchmark-results/${isa}.md"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          for isa in sse42 avx avx2; do
            "./build/vectormathbench_phase_a_${isa}" \
              > "benchmark-results/phase-a-${isa}.md"
            {
              echo "## Phase A representation proof / ${isa}"
              cat "benchmark-results/phase-a-${isa}.md"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload benchmark data
        uses: actions/upload-artifact@v6
        with:
          name: vectormathbench-${{ github.run_id }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 7
